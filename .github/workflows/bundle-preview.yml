name: Bundle preview regression
on:
  pull_request:
  push:
    branches: [codex/bundle-builder-preview]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bundle_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: bundle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bundle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BUNDLE_TEST_DATABASE_URL: postgresql://bundle_test:test_only@localhost:5432/bundle_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:bundles:browser
      - name: Install POS guide test dependencies
        run: npm install --global pnpm@11.25.0 && pnpm --dir apps/head-happy-pos-deals install --frozen-lockfile
      - run: node tests/pos-guide-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-preview-browser
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
