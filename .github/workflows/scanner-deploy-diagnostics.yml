name: Scanner post-deploy verification
on:
  push:
    branches: [fix/scanner-preview]
    paths: ['.github/workflows/scanner-deploy-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '5ad78f40cc02d9da55105ece5d5a6b6a718ee573'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify deployed camera bytes, app pages and read-only data
        env:
          EXPECTED_COMMIT: '5ad78f40cc02d9da55105ece5d5a6b6a718ee573'
        run: node tests/deployed-smoke.mjs
